<div class="auth-container">

  <div class="auth-card">

    <h2>Create Account</h2>

    <form>

      <input
        type="text"
        class="form-control"
        placeholder="Full Name"
      />

      <input
        type="email"
        class="form-control"
        placeholder="Email Address"
      />

      <input
        type="password"
        class="form-control"
        placeholder="Password"
      />

      <button class="btn btn-primary w-100">
        Register
      </button>

    </form>
<p class="login-text">
  Already have an account?
  <a routerLink="/login">Login</a>
</p>
  </div>

</div>
