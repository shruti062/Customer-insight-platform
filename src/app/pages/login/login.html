<div class="auth-container">

  <div class="auth-card">

    <h2>Login</h2>

    <form>

      <input
        type="email"
        class="form-control"
        placeholder="Email Address"
      />

      <input
        type="password"
        class="form-control"
        placeholder="Password"
      />

      <button class="btn btn-primary w-100">
        Login
      </button>

    </form>
<p class="register-text">

      Don't have an account?

      <a routerLink="/register">
        Register
      </a>

    </p>

  </div>

</div>
